<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /skeleton -->
<title>strokerate.app mock-ups</title>
<meta name="description" content="Design mock-ups of the on-water screen for strokerate.app, a free open-source rowing computer for your phone.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: a full-bleed instrument. Tiles on a CSS grid, each number sized to fill its tile
   (container query units). The grid changes with layout choice and orientation.
   Skins only set the screen colours; the settings sheet keeps one dark look. */
:root {
  --num: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* screen skin (default: night orange) */
  --bg: #000000;
  --fg: #ff8a1f;
  --dim: #c96f1d;
  --rule: #3b230d;

  /* settings sheet */
  --sheet: #17130f;
  --sheet-fg: #f3ece5;
  --sheet-dim: #a59a8f;
  --sheet-line: #3a3129;
  --sheet-accent: #ff8a1f;

  color-scheme: dark;
}
[data-skin="night-white"] { --bg: #000000; --fg: #ffffff; --dim: #a3a9ad; --rule: #2b2f33; }
[data-skin="dawn-red"]    { --bg: #000000; --fg: #ff3b2f; --dim: #b3302a; --rule: #3a0f0c; }
[data-skin="daylight"]    { --bg: #ffffff; --fg: #000000; --dim: #3d3d3d; --rule: #c9c9c9; }
[data-skin="lcd"]         { --bg: #c3cbb8; --fg: #121611; --dim: #3c4535; --rule: #96a08a; }
[data-skin="hi-vis"]      { --bg: #ffd60a; --fg: #000000; --dim: #3b3200; --rule: #c7a600; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

.app {
  position: relative;
  height: 100%;
  background: var(--bg);
  padding:
    env(safe-area-inset-top, 0px)
    env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
  box-sizing: border-box;
  transition: background-color .25s;
}

/* ---------- the screen ---------- */
.screen {
  height: 100%;
  display: grid;
  gap: 2px;
  background: var(--rule);
}
.m {
  display: none;
  grid-template-rows: auto 1fr;
  min-width: 0;
  min-height: 0;
  padding: clamp(6px, 1.6vmin, 14px) clamp(8px, 2.4vmin, 18px) clamp(2px, 1vmin, 8px);
  background: var(--bg);
  transition: background-color .25s;
}
.m-rate    { grid-area: rate; --w: 1.08; }
.m-split   { grid-area: split; --w: 2.62; }
.m-speed   { grid-area: speed; --w: 1.86; }
.m-time    { grid-area: time; --w: 2.36; }
.m-dist    { grid-area: dist; --w: 2.12; }
.m-strokes { grid-area: strokes; --w: 1.6; }

.hd {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: .5em;
  font: 700 clamp(11px, 2.9vmin, 19px)/1 var(--ui);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--dim);
  white-space: nowrap;
}
.hd .u { text-transform: none; letter-spacing: .02em; font-weight: 600; }
.hd .l { display: inline-flex; align-items: center; gap: .45em; }

.box {
  container-type: size;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.val {
  font-family: var(--num);
  font-weight: 600;
  font-variant-numeric: tabular-nums lining-nums;
  font-size: min(100cqh, calc(94cqw / var(--w)));
  line-height: .78;
  letter-spacing: -.01em;
  color: var(--fg);
  white-space: nowrap;
  transition: color .25s;
}
.val .p { letter-spacing: -.04em; } /* tighten colons and decimal points */

/* catch indicator: blinks once per stroke */
.catch {
  width: .62em; height: .62em;
  border-radius: 50%;
  background: var(--fg);
  opacity: .18;
}
.catch.on { animation: catch .45s ease-out; }
@keyframes catch { from { opacity: 1; transform: scale(1.25); } to { opacity: .18; transform: scale(1); } }

/* ---------- layouts (portrait first, landscape overrides) ---------- */

/* Classic: rate over split, two small tiles below */
[data-layout="classic"] .screen {
  grid-template: "rate rate" 1.2fr "split split" 1.05fr "speed time" .62fr / 1fr 1fr;
}
[data-layout="classic"] :is(.m-rate, .m-split, .m-speed, .m-time) { display: grid; }

/* Split first: pace is the hero */
[data-layout="split"] .screen {
  grid-template: "split split" 1.25fr "rate rate" .95fr "time dist" .55fr / 1fr 1fr;
}
[data-layout="split"] :is(.m-split, .m-rate, .m-time, .m-dist) { display: grid; }

/* Four up: equal tiles, the classic rowing-computer grid */
[data-layout="four"] .screen {
  grid-template: "rate" 1fr "split" 1fr "speed" .62fr "time" .62fr / 1fr;
}
[data-layout="four"] :is(.m-rate, .m-split, .m-speed, .m-time) { display: grid; }

/* Big two: only rate and split, as large as possible */
[data-layout="duo"] .screen {
  grid-template: "rate" 1fr "split" 1fr / 1fr;
}
[data-layout="duo"] :is(.m-rate, .m-split) { display: grid; }

/* Full data: six tiles */
[data-layout="full"] .screen {
  grid-template: "rate rate" 1.1fr "split split" 1fr "speed time" .7fr "dist strokes" .7fr / 1fr 1fr;
}
[data-layout="full"] .m { display: grid; }

@media (orientation: landscape) {
  [data-layout="classic"] .screen {
    grid-template: "rate split split" 1.55fr "speed time time" 1fr / 1fr 1fr 1fr;
  }
  [data-layout="split"] .screen {
    grid-template: "split split rate" 1.5fr "split split time" 1fr / 1fr 1fr 1.05fr;
  }
  [data-layout="split"] .m-dist { display: none; }
  [data-layout="four"] .screen {
    grid-template: "rate split" 1fr "speed time" 1fr / 1fr 1.45fr;
  }
  [data-layout="duo"] .screen {
    grid-template: "rate split" 1fr / 1fr 1.7fr;
  }
  [data-layout="full"] .screen {
    grid-template: "rate split split" 1.4fr "speed time dist" 1fr / 1fr 1fr 1fr;
  }
  [data-layout="full"] .m-strokes { display: none; }
}

/* ---------- settings sheet ---------- */
.gear {
  position: absolute;
  right: calc(10px + env(safe-area-inset-right, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--rule);
  background: var(--bg);
  color: var(--dim);
  display: grid; place-items: center;
  opacity: .55;
  cursor: pointer;
}
.gear svg { width: 22px; height: 22px; }
.gear:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.sheet {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(100%, 680px);
  max-height: min(78%, 620px);
  overflow-y: auto;
  box-sizing: border-box;
  padding: 14px max(16px, calc(12px + env(safe-area-inset-left, 0px))) calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--sheet);
  color: var(--sheet-fg);
  border: 1px solid var(--sheet-line);
  border-bottom: 0;
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .45);
  font-size: 14px;
  display: grid;
  gap: 14px;
  -webkit-user-select: text;
  user-select: text;
}
.sheet[hidden] { display: none !important; }
.sheet-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font: 700 17px/1.2 var(--ui); letter-spacing: .01em; }
.brand small { display: block; font-weight: 500; font-size: 13px; color: var(--sheet-dim); letter-spacing: 0; margin-top: 2px; }
.sheet h2 {
  margin: 0 0 7px;
  font: 700 11px/1 var(--ui);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--sheet-dim);
}
.btn {
  font: 600 14px/1 var(--ui);
  color: var(--sheet-fg);
  background: transparent;
  border: 1px solid var(--sheet-line);
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 40px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { border-color: var(--sheet-dim); }
.btn:focus-visible, .sw:focus-visible { outline: 2px solid var(--sheet-accent); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--sheet-fg); color: var(--sheet); border-color: var(--sheet-fg); }

.layouts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.layouts .btn { flex-direction: column; padding: 8px 4px 9px; gap: 7px; font-size: 12.5px; }
.thumb { width: 26px; height: 38px; display: grid; gap: 2px; }
.thumb i { background: currentColor; opacity: .55; border-radius: 1.5px; }
.thumb i.big { opacity: 1; }

.skins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.sw {
  border: 1px solid var(--sheet-line);
  border-radius: 10px;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  background: none;
  color: var(--sheet-fg);
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  text-align: left;
  font: 600 13px/1.15 var(--ui);
}
.sw b {
  font: 600 26px/1 var(--num);
  padding: 7px 10px;
  min-width: 2ch;
  text-align: center;
  border-right: 1px solid var(--sheet-line);
}
.sw span { padding: 0 9px; }
.sw[aria-pressed="true"] { border-color: var(--sheet-fg); box-shadow: inset 0 0 0 1px var(--sheet-fg); }

.note { margin: 8px 0 0; color: var(--sheet-dim); line-height: 1.45; max-width: 62ch; }
.note strong { color: var(--sheet-fg); font-weight: 600; }

.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { margin: 0; color: var(--sheet-dim); font-size: 12.5px; }

@media (max-width: 420px) {
  .layouts .btn { font-size: 11.5px; }
  .skins { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .sheet { max-height: 92%; gap: 10px; padding-top: 10px; }
  .thumb { display: none; }
  .skins { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .sw { grid-template-columns: 1fr; text-align: center; }
  .sw b { border-right: 0; border-bottom: 1px solid var(--sheet-line); }
  .sw span { padding: 6px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .catch.on { animation: none; opacity: 1; }
  .app, .m, .val { transition: none; }
}
</style>
<!-- /head -->
</head>
<body>
<!-- body -->
<div class="app" id="app" data-layout="classic" data-skin="night-orange">
  <main class="screen" id="screen" aria-label="On-water display (simulated data)">
    <section class="m m-rate">
      <div class="hd"><span class="l"><i class="catch" id="catch"></i>Rate</span><span class="u">spm</span></div>
      <div class="box"><span class="val" id="v-rate">22</span></div>
    </section>
    <section class="m m-split">
      <div class="hd"><span class="l">Split</span><span class="u">/500m</span></div>
      <div class="box"><span class="val" id="v-split">2:01.4</span></div>
    </section>
    <section class="m m-speed">
      <div class="hd"><span class="l">Speed</span><span class="u">m/s</span></div>
      <div class="box"><span class="val" id="v-speed">4.12</span></div>
    </section>
    <section class="m m-time">
      <div class="hd"><span class="l">Time</span><span class="u">min</span></div>
      <div class="box"><span class="val" id="v-time">7:42</span></div>
    </section>
    <section class="m m-dist">
      <div class="hd"><span class="l">Distance</span><span class="u">m</span></div>
      <div class="box"><span class="val" id="v-dist">1840</span></div>
    </section>
    <section class="m m-strokes">
      <div class="hd"><span class="l">Strokes</span><span class="u">count</span></div>
      <div class="box"><span class="val" id="v-strokes">171</span></div>
    </section>
  </main>

  <button class="gear" id="gear" type="button" aria-label="Show display settings" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>

  <aside class="sheet" id="sheet" aria-label="Display settings">
    <div class="sheet-hd">
      <div class="brand">strokerate.app<small>Design mock-up. The numbers are simulated.</small></div>
      <button class="btn" id="close" type="button">Hide</button>
    </div>

    <div>
      <h2>Layout</h2>
      <div class="layouts" id="layouts">
        <button class="btn" type="button" id="lay-classic" data-layout="classic">
          <span class="thumb" style="grid-template:1.2fr 1.05fr .62fr/1fr 1fr" aria-hidden="true"><i class="big" style="grid-column:1/3"></i><i class="big" style="grid-column:1/3"></i><i></i><i></i></span>Classic</button>
        <button class="btn" type="button" id="lay-split" data-layout="split">
          <span class="thumb" style="grid-template:1.25fr .95fr .55fr/1fr 1fr" aria-hidden="true"><i class="big" style="grid-column:1/3"></i><i style="grid-column:1/3"></i><i></i><i></i></span>Split first</button>
        <button class="btn" type="button" id="lay-four" data-layout="four">
          <span class="thumb" style="grid-template:1fr 1fr .62fr .62fr/1fr" aria-hidden="true"><i class="big"></i><i class="big"></i><i></i><i></i></span>Four up</button>
        <button class="btn" type="button" id="lay-duo" data-layout="duo">
          <span class="thumb" style="grid-template:1fr 1fr/1fr" aria-hidden="true"><i class="big"></i><i class="big"></i></span>Big two</button>
        <button class="btn" type="button" id="lay-full" data-layout="full">
          <span class="thumb" style="grid-template:1.1fr 1fr .7fr .7fr/1fr 1fr" aria-hidden="true"><i class="big" style="grid-column:1/3"></i><i class="big" style="grid-column:1/3"></i><i></i><i></i><i></i><i></i></span>Full data</button>
      </div>
    </div>

    <div>
      <h2>Colours</h2>
      <div class="skins" id="skins">
        <button class="sw" type="button" id="sk-night-orange" data-skin="night-orange"><b style="background:#000;color:#ff8a1f">24</b><span>Night orange</span></button>
        <button class="sw" type="button" id="sk-night-white" data-skin="night-white"><b style="background:#000;color:#fff">24</b><span>Night white</span></button>
        <button class="sw" type="button" id="sk-dawn-red" data-skin="dawn-red"><b style="background:#000;color:#ff3b2f">24</b><span>Dawn red</span></button>
        <button class="sw" type="button" id="sk-daylight" data-skin="daylight"><b style="background:#fff;color:#000">24</b><span>Daylight</span></button>
        <button class="sw" type="button" id="sk-lcd" data-skin="lcd"><b style="background:#c3cbb8;color:#121611">24</b><span>LCD</span></button>
        <button class="sw" type="button" id="sk-hi-vis" data-skin="hi-vis"><b style="background:#ffd60a;color:#000">24</b><span>Hi-vis</span></button>
      </div>
      <p class="note" id="skin-note"></p>
    </div>

    <div class="actions">
      <button class="btn" type="button" id="fs">Full screen</button>
      <button class="btn" type="button" id="wake" aria-pressed="false">Keep screen on</button>
      <a class="btn" href="https://github.com/JoostGevaert/strokerate-app/issues" target="_blank" rel="noopener">Give feedback</a>
    </div>
    <p class="hint" id="hint">Tap the numbers to hide or show this panel. Turn your phone to see the landscape layout.</p>
  </aside>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $('app');

  const LAYOUTS = ['classic', 'split', 'four', 'duo', 'full'];
  const SKINS = {
    'night-orange': { bg: '#000000', fg: '#ff8a1f', note: 'Dark with orange digits. Easy on the eyes at dawn, dusk and under cloud, and saves battery on OLED screens. In direct sun the glare on the glass washes it out sooner than a light screen.' },
    'night-white':  { bg: '#000000', fg: '#ffffff', note: 'Dark with white digits. The most contrast a dark screen can give, still at its best out of direct sun.' },
    'dawn-red':     { bg: '#000000', fg: '#ff3b2f', note: 'Red on black keeps your night vision for pre-dawn outings. Too dim for daylight.' },
    'daylight':     { bg: '#ffffff', fg: '#000000', note: 'Black on white at full brightness. The best choice in bright sun: reflections on the glass matter much less on a light screen.' },
    'lcd':          { bg: '#c3cbb8', fg: '#121611', note: 'Looks like the reflective LCD on a classic rowing computer. Softer than Daylight, with less glare off a wet screen.' },
    'hi-vis':       { bg: '#ffd60a', fg: '#000000', note: 'Black on yellow. Very bright and stands out in sun, like a safety vest.' },
  };

  // WCAG contrast ratio
  const lum = (hex) => {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const contrast = (a, b) => {
    const [l1, l2] = [lum(a), lum(b)].sort((x, y) => y - x);
    return (l1 + 0.05) / (l2 + 0.05);
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  function apply(layout, skin, push = true) {
    app.dataset.layout = layout;
    app.dataset.skin = skin;
    document.querySelectorAll('[data-layout].btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.layout === layout)));
    document.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.skin === skin)));
    const s = SKINS[skin];
    $('skin-note').innerHTML = `${s.note} <strong>Contrast ${contrast(s.bg, s.fg).toFixed(1)}:1.</strong>`;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = s.bg;
    store.set('sr-layout', layout);
    store.set('sr-skin', skin);
    if (push) { try { history.replaceState(null, '', `#${layout}-${skin}`); } catch {} }
  }

  // start from #layout-skin, then saved choice, then defaults
  const fromHash = location.hash.slice(1);
  let layout = LAYOUTS.find((l) => fromHash.startsWith(l + '-')) || store.get('sr-layout');
  let skin = layout && fromHash.startsWith(layout + '-') ? fromHash.slice(layout.length + 1) : store.get('sr-skin');
  if (!LAYOUTS.includes(layout)) layout = 'classic';
  if (!SKINS[skin]) skin = 'night-orange';
  apply(layout, skin, false);

  $('layouts').addEventListener('click', (e) => {
    const b = e.target.closest('[data-layout]');
    if (b) apply(b.dataset.layout, app.dataset.skin);
  });
  $('skins').addEventListener('click', (e) => {
    const b = e.target.closest('[data-skin]');
    if (b) apply(app.dataset.layout, b.dataset.skin);
  });

  // settings sheet
  const sheet = $('sheet'), gear = $('gear');
  const showSheet = (on) => { sheet.hidden = !on; gear.hidden = on; };
  $('screen').addEventListener('click', () => showSheet(sheet.hidden));
  $('close').addEventListener('click', () => showSheet(false));
  gear.addEventListener('click', () => showSheet(true));

  // full screen (not available on iPhone Safari)
  $('fs').addEventListener('click', async () => {
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (el.requestFullscreen) { await el.requestFullscreen({ navigationUI: 'hide' }); showSheet(false); }
      else throw new Error('unsupported');
    } catch {
      $('hint').textContent = 'Full screen is not available here. On iPhone, use Share, then Add to Home Screen.';
    }
  });

  // keep screen on
  let lock = null;
  const wakeBtn = $('wake');
  async function setWake(on) {
    try {
      if (on) {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { if (!document.hidden) wakeBtn.setAttribute('aria-pressed', 'false'); });
      } else if (lock) { await lock.release(); lock = null; }
      wakeBtn.setAttribute('aria-pressed', String(on));
    } catch {
      wakeBtn.setAttribute('aria-pressed', 'false');
      $('hint').textContent = 'This browser would not keep the screen on.';
    }
  }
  wakeBtn.addEventListener('click', () => setWake(wakeBtn.getAttribute('aria-pressed') !== 'true'));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && wakeBtn.getAttribute('aria-pressed') === 'true') setWake(true);
  });

  // ---------- simulated row: steady state with a 20-stroke push every ~2 minutes ----------
  const P = (s) => s.replace(/([:.])/g, '<span class="p">$1</span>');
  const mmss = (sec) => {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return (h ? `${h}:${String(m).padStart(2, '0')}` : `${m}`) + `:${String(s).padStart(2, '0')}`;
  };
  const split = (mps) => {
    const t = 500 / mps, m = Math.floor(t / 60), s = t - m * 60;
    return `${m}:${s.toFixed(1).padStart(4, '0')}`;
  };
  const noise = (a) => (Math.random() - 0.5) * 2 * a;

  let rate = 22, speed = 4.08, elapsed = 462, dist = 1840, strokes = 171;
  let last = performance.now();
  const targetRate = () => ((elapsed % 120) < 30 ? 29 : 21.5);

  function stroke() {
    rate += (targetRate() - rate) * 0.35 + noise(0.5);
    strokes += 1;
    $('v-rate').textContent = Math.round(rate);
    $('v-strokes').textContent = strokes;
    const c = $('catch');
    c.classList.remove('on'); void c.offsetWidth; c.classList.add('on');
    setTimeout(stroke, 60000 / rate);
  }
  function tick() {
    const now = performance.now(), dt = Math.min((now - last) / 1000, 2);
    last = now;
    const targetSpeed = 2.7 + rate * 0.063;
    speed += (targetSpeed - speed) * 0.12 + noise(0.025);
    elapsed += dt;
    dist += speed * dt;
    $('v-speed').innerHTML = P(speed.toFixed(2));
    $('v-split').innerHTML = P(split(speed));
    $('v-time').innerHTML = P(mmss(elapsed));
    $('v-dist').textContent = Math.floor(dist);
  }
  tick();
  setInterval(tick, 500);
  setTimeout(stroke, 60000 / rate);
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
